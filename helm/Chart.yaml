  condition: "deployment.svc"
  alias: "svc"
- name: onecx-human-task-bff
  version: "*-0"
  repository: oci://ghcr.io/onecx-apps/charts
  condition: "deployment.bff"
  alias: "bff"
- name: onecx-human-task-ui
  version: "*-0"
  repository: oci://ghcr.io/onecx-apps/charts
  condition: "deployment.ui"
  alias: "ui"
- name: onecx-human-task-n8n-adapter
  version: "*-0"
  repository: oci://ghcr.io/onecx-apps/charts
  condition: "deployment.n8nAdapter"
  alias: "n8nAdapter"